<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft - Export Complete</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow:
                0 5px 20px rgba(
                    0,
                    0,
                    0,
                    0.12
                );
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin: 10px 5px;
            padding: 13px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .download {
            background: #222;
            color: white;
        }

        .home {
            background: #e5e5e5;
            color: #222;
        }

        .button:hover {
            opacity: 0.85;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <div class="icon">
            ✓
        </div>


        <h1>
            Comic Exported Successfully!
        </h1>


        <p>
            Your ComicCraft comic has been
            successfully converted into a PDF.
        </p>


        {% if pdf_url %}

        <a
            href="{{ pdf_url }}"
            class="button download"
            target="_blank"
        >
            Download PDF
        </a>

        {% endif %}


        <a
            href="/"
            class="button home"
        >
            Create New Comic
        </a>

    </div>

</div>


</body>

</html>
